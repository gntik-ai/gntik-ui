# Solo necesario si el server debe clonar un repo PRIVADO en vivo
# (GNTIK_UI_REPO). Crea el secret real con:
#   kubectl create secret generic gntik-ui-mcp --from-literal=github-token=ghp_xxx
apiVersion: v1
kind: Secret
metadata:
  name: gntik-ui-mcp
type: Opaque
stringData:
  github-token: REEMPLAZAME
