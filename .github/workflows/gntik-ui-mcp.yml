# ============================================================================
# gntik-ui-mcp — CI: tests + smoke E2E → imagen multi-arch en GHCR
# La imagen empaqueta un snapshot del catálogo, así que se reconstruye en cada
# push a main (cambie el server o cambien los componentes).
# Publica: ghcr.io/gntik-ai/gntik-ui-mcp:{latest, sha-…, X.Y.Z con tag mcp-vX.Y.Z}
# ============================================================================
name: gntik-ui-mcp

on:
  push:
    branches: [main]
    tags: ['mcp-v*']
  pull_request:
    paths:
      - 'mcp/**'
      - '.github/workflows/gntik-ui-mcp.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Unit tests (indexer · validate · analyze contra el catálogo real)
        run: npm test
      - name: Smoke E2E (cliente MCP por stdio)
        run: npm run smoke

  image:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gntik-ui-mcp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=match,pattern=mcp-v(.*),group=1
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
