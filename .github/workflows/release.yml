name: Release

on:
  push:
    branches: [main]
  # Manual retry from the Actions tab (e.g. after a failed run), without a new commit.
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # npm provenance: the publish is signed with this workflow's OIDC identity.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: '@gntik-ai'
      - run: pnpm install --frozen-lockfile
      - name: Version PR or publish
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # @gntik-ai/* publish publicly to npmjs.org (gntik-ui#71); GITHUB_TOKEN only
          # opens the Version Packages PR.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PNPM_CONFIG_PROVENANCE: 'true'
