name: Canary

# Publishes snapshot versions (0.0.0-canary-<datetime>, dist-tag "canary") of the packages that
# have pending changesets, so products can try main before the "Version packages" PR is merged:
#   pnpm add @gntik-ai/ui@canary
# Nothing is committed or tagged: the snapshot versions only exist in this job's checkout.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Pending changesets?
        id: pending
        run: |
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "No pending changesets: nothing to publish." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.pending.outputs.count != '0'
        run: corepack enable
      - if: steps.pending.outputs.count != '0'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@gntik-ai"
      - if: steps.pending.outputs.count != '0'
        run: pnpm install --frozen-lockfile
      - name: Snapshot versions
        if: steps.pending.outputs.count != '0'
        run: pnpm changeset version --snapshot canary
      - name: Build
        if: steps.pending.outputs.count != '0'
        run: pnpm -r build
      - name: Publish (dist-tag canary)
        if: steps.pending.outputs.count != '0'
        run: |
          set -o pipefail
          pnpm changeset publish --tag canary --no-git-tag | tee publish.log
          {
            echo "### Canary published"
            echo '```'
            grep -E 'published|New tag' publish.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
