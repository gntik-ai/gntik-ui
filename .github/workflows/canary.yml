name: Canary

# Publishes snapshot versions (0.0.0-canary-<datetime>, dist-tag "canary") of the packages that
# have pending changesets, so products can try main before the "Version packages" PR is merged:
#   pnpm add @gntik-ai/ui@canary
# Nothing is committed or tagged: the snapshot versions only exist in this job's checkout.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # npm provenance: the publish is signed with this workflow's OIDC identity.
  id-token: write

jobs:
  canary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: '@gntik-ai'
      - run: pnpm install --frozen-lockfile
      # gntik-ui#829: count only pending changesets that name a public package, so a
      # private-only changeset or a Version Packages merge never triggers a canary publish.
      - name: Pending changesets?
        id: pending
        run: |
          set -o pipefail
          node packages/mcp/scripts/canary-plan.mjs | tee -a "$GITHUB_OUTPUT"
          if grep -q '^count=0$' "$GITHUB_OUTPUT"; then
            echo "No pending changesets for public packages: nothing to publish." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Snapshot versions
        if: steps.pending.outputs.count != '0'
        run: pnpm changeset version --snapshot canary
      # gntik-ui#829: refuse to publish any public package whose version is not a canary snapshot.
      - name: Verify only snapshot versions would publish
        if: steps.pending.outputs.count != '0'
        run: node packages/mcp/scripts/canary-plan.mjs --verify-snapshot
      - name: Build
        if: steps.pending.outputs.count != '0'
        run: pnpm -r build
      - name: Publish (dist-tag canary)
        if: steps.pending.outputs.count != '0'
        run: |
          set -o pipefail
          pnpm changeset publish --tag canary --no-git-tag | tee publish.log
          {
            echo "### Canary published"
            echo '```'
            grep -E 'published|New tag' publish.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PNPM_CONFIG_PROVENANCE: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
