# ============================================================================
# CI — lint, types, unit tests, registry freshness, docs build, visual baselines
# ============================================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Packages consume each other's built dist (chat/blocks/templates → ui), so build first
      # (pnpm -r build runs in dependency order).
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (all packages, keyboard + axe contracts)
        run: pnpm test
      - name: registry.json and kit-registry.json are up to date
        run: pnpm registry:check
      - name: Gate — musematic is built only from the kit
        run: node apps/musematic/scripts/check-kit-only.mjs

  a11y:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gntik-ai/docs build
      - run: pnpm --filter @gntik-ai/docs exec playwright install --with-deps chromium
      - name: axe on @gntik-ai/ui in dark, light and high contrast (against a11y-baseline.json)
        run: pnpm a11y

  visual:
    needs: checks
    runs-on: ubuntu-latest
    # Baselines were first recorded outside CI; if fonts or antialiasing differ
    # on the runner, regenerate them with `pnpm visual:update` from CI output.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gntik-ai/docs build
      - run: pnpm --filter @gntik-ai/docs exec playwright install --with-deps chromium
      - name: Visual baselines (63 entries dark + 8 in light and high contrast)
        run: pnpm visual
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: |
            apps/docs/playwright-report
            apps/docs/test-results
