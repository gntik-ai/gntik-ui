packages:
  - apps/*
  - packages/*

# Recursive runs (pnpm -r build/test) handle two packages at a time. Unbounded, `pnpm test`
# started ~4 vitest packages at once with up to ~7 workers each on 8 cores and, with a
# Next.js build, ran Hermes makers out of their 5G memory cap (gntik-ui #25).
workspaceConcurrency: 2

# Supply-chain guard: only resolve releases published at least 7 days ago.
minimumReleaseAge: 10080
# The kit's own 2026-10-13 release, published from this repository, is exempt by exact
# version so the default-English baseline can use it (gntik-ui #30). Every other version
# of these packages, and every third-party package, still waits 7 days.
minimumReleaseAgeExclude:
  - '@gntik-ai/blocks@0.5.0'
  - '@gntik-ai/charts@0.5.0'
  - '@gntik-ai/editor@0.5.0'
  - '@gntik-ai/flow@0.5.0'
  - '@gntik-ai/icons@0.5.0'
  - '@gntik-ai/tokens@0.2.1'
  - '@gntik-ai/ui@0.5.0'

allowBuilds:
  esbuild: true
