<!-- ReactFlow (motor del lienzo de nodos) — base CSS; reactflow.jsx inyecta el tema de marca -->
<link rel="stylesheet" href="https://unpkg.com/reactflow@11.11.4/dist/style.css" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Mapea cada token de tokens/brand.css a hsl(var(--token) / <alpha>) → habilita bg-primary/14 y el switch de tema.
  const hsl = (v) => `hsl(var(${v}) / <alpha-value>)`;
  tailwind.config = {
    darkMode: ['class', '.dark'],
    theme: {
      extend: {
        colors: {
          background: hsl('--background'),
          foreground: hsl('--foreground'),
          card: { DEFAULT: hsl('--card'), foreground: hsl('--card-foreground') },
          popover: { DEFAULT: hsl('--popover'), foreground: hsl('--popover-foreground') },
          primary: { DEFAULT: hsl('--primary'), foreground: hsl('--primary-foreground') },
          secondary: { DEFAULT: hsl('--secondary'), foreground: hsl('--secondary-foreground') },
          muted: { DEFAULT: hsl('--muted'), foreground: hsl('--muted-foreground') },
          accent: { DEFAULT: hsl('--accent'), foreground: hsl('--accent-foreground') },
          destructive: { DEFAULT: hsl('--destructive'), foreground: hsl('--destructive-foreground') },
          border: hsl('--border'),
          input: hsl('--input'),
          ring: hsl('--ring'),
          chrome: hsl('--chrome'),
          brand: { secondary: hsl('--brand-secondary'), accent: hsl('--brand-accent') },
          success: hsl('--success'),
          warning: hsl('--warning'),
          info: hsl('--info'),
          category: { rose: hsl('--category-rose'), violet: hsl('--category-violet'), amber: hsl('--category-amber'), cyan: hsl('--category-cyan') },
        },
        fontFamily: {
          sans: ['var(--font-sans)', 'Geist', 'Helvetica Neue', 'Arial', 'sans-serif'],
          mono: ['var(--font-mono)', 'Geist Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
        },
        borderRadius: { DEFAULT: 'var(--radius)', sm: 'var(--radius-sm)', md: 'var(--radius-md)', lg: 'var(--radius-lg)', xl: 'var(--radius-xl)', full: '9999px' },
        boxShadow: { sm: 'var(--shadow-sm)', DEFAULT: 'var(--shadow-md)', md: 'var(--shadow-md)', lg: 'var(--shadow-lg)' },
        spacing: { '18': '4.5rem' },
      },
    },
  };
</script>

<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  * { box-sizing: border-box; }
  body { font-family: var(--font-sans); -webkit-font-smoothing: antialiased; background: hsl(var(--background)); color: hsl(var(--foreground)); }
  svg { display: block; }
  ::selection { background: hsl(var(--primary) / 0.28); }

  /* Scrollbars sobrios por tema */
  *::-webkit-scrollbar { width: 11px; height: 11px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: hsl(var(--border)); border-radius: 6px; border: 3px solid transparent; background-clip: content-box; }
  *::-webkit-scrollbar-thumb:hover { background: hsl(var(--muted-foreground) / 0.5); background-clip: content-box; }

  /* Superficie de preview — retícula de puntos sutil */
  .preview-surface {
    background-color: hsl(var(--background));
    background-image: radial-gradient(hsl(var(--border) / 0.7) 1px, transparent 1px);
    background-size: 18px 18px;
    background-position: -9px -9px;
  }

  pre, code, .mono { font-family: var(--font-mono); font-variant-ligatures: none; }
  pre { tab-size: 2; }
</style>

<!-- ResizeObserver con sondeo: el iframe de preview no entrega callbacks de RO nativo,
     y ReactFlow/Recharts dependen de ellos para medir. Esto los reactiva. -->
<script>
(function () {
  var all = [], timer = null;
  function tick() {
    for (var i = 0; i < all.length; i++) all[i]._check();
    if (!all.length) { clearInterval(timer); timer = null; }
  }
  function ensure() { if (timer == null && all.length) { timer = setInterval(tick, 150); setTimeout(tick, 0); } }
  function RO(cb) { this._cb = cb; this._targets = new Map(); }
  RO.prototype.observe = function (el) {
    if (!el || this._targets.has(el)) return;
    this._targets.set(el, { w: -1, h: -1 });
    if (all.indexOf(this) === -1) all.push(this);
    ensure();
  };
  RO.prototype.unobserve = function (el) {
    this._targets.delete(el);
    if (this._targets.size === 0) { var i = all.indexOf(this); if (i > -1) all.splice(i, 1); }
  };
  RO.prototype.disconnect = function () { this._targets.clear(); var i = all.indexOf(this); if (i > -1) all.splice(i, 1); };
  RO.prototype._check = function () {
    var entries = [], self = this;
    this._targets.forEach(function (last, el) {
      if (!el.isConnected) return;
      var r = el.getBoundingClientRect(), w = r.width, h = r.height;
      if (w !== last.w || h !== last.h) {
        last.w = w; last.h = h;
        entries.push({ target: el, contentRect: { width: w, height: h, top: 0, left: 0, bottom: h, right: w, x: 0, y: 0 } });
      }
    });
    if (entries.length) { try { self._cb(entries, self); } catch (e) {} }
  };
  window.ResizeObserver = RO;
})();
</script>
